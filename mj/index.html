<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#111014">
<title>Ma table · MJ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111014;--card:#1b1a20;--ink:#ecebf0;--mute:#9d9aa8;--line:#2d2b34;--acc:#c9b37a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:8px 0 22px}
header .logo{width:44px;height:44px;border-radius:12px;background:url(icon-192.png) center/cover}
header h1{font:600 1.35rem Inter,sans-serif;margin:0;letter-spacing:.2px}
header p{margin:0;color:var(--mute);font-size:.85rem}
.etapes{display:flex;gap:6px;margin:0 0 14px;font-size:.8rem;color:var(--mute);flex-wrap:wrap}
.etapes button{all:unset;cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:99px}
.etapes button.on{color:var(--ink);border-color:var(--acc)}
.etapes button:disabled{opacity:.4;cursor:default}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:22px 0 10px;font-weight:600}
.jeu{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin:0 0 12px;cursor:pointer;color:var(--c-ink);background:var(--c-bg);position:relative;overflow:hidden;font:inherit}
.jeu::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c-acc) 22%,transparent),transparent 60%);pointer-events:none}
.jeu .nom{font-size:2rem;line-height:1.05;margin:0 0 4px;letter-spacing:.02em}
.jeu .genre{padding-right:84px;font-size:.75rem;text-transform:uppercase;letter-spacing:.16em;color:var(--c-acc);font-weight:600}
.jeu .acc{margin:8px 0 0;font-size:.92rem;opacity:.85}
.jeu .nb{position:absolute;right:16px;top:16px;font-size:.75rem;opacity:.7}
.sc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;color:var(--ink);font:inherit;cursor:pointer}
.sc b{font-size:1.15rem;display:block}
.sc small{color:var(--mute);display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.sc span{display:block;font-size:.9rem;margin-top:4px;opacity:.85}
.choix{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.choix .t{font-size:1.4rem;margin:0}
.choix .s{color:var(--mute);margin:2px 0 14px;font-size:.9rem}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:0;font:600 1.05rem Inter,sans-serif;text-decoration:none;margin:8px 0 0;cursor:pointer}
.go.p{background:var(--acc);color:#111}
.go.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.reprendre{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;color:var(--ink);text-decoration:none;margin:0 0 6px}
.reprendre .i{font-size:1.6rem}
.reprendre small{display:block;color:var(--mute);font-size:.78rem}
.effacer{display:block;margin:0 0 14px auto;background:none;border:0;color:#ff8a80;font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer;padding:4px 2px}
.lien{color:var(--mute);font-size:.85rem;text-align:center;margin:30px 0 0}
.lien a{color:var(--mute)}
.mjtag{display:inline-block;background:#5a1d1d;color:#ffd9d3;font-size:.7rem;letter-spacing:.1em;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;font-size:.9rem}
#toast.show{transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo"></div><div><h1 id="titre"></h1><p id="sous"></p></div></header>
  <div id="app"></div>
  <p class="lien" id="bas"></p>
</div>
<div id="toast"></div>
<script>
const JEUX=[{"id":"aria","nom":"Aria","genre":"Fantasy médiévale","accroche":"Royaume d'Aria · magie, intrigues et vieilles légendes.","couleurs":{"fond":"#1b140c","encre":"#f1e4c6","accent":"#dcaa4a"},"police":"'Cormorant Garamond',Georgia,serif","scenarios":[{"id":"jours-de-peste","nom":"Jours de peste","type":"Prélude 2 · one-shot ~4 h","resume":"Une épidémie, un village qui se meurt et un seigneur qui se fait attendre.","joueurs":"aria/","mj":"aria/mj/","etatMj":{"cles":["aria-grimoire-mj-v1"],"garder":["precedemment"]},"etatJoueurs":{"cles":["aria-carnet-v1","aria-lieux-v1"]}}]},{"id":"channel-fear","nom":"Channel Fear","genre":"Horreur contemporaine · found footage","accroche":"Une équipe de télé-réalité paranormale sillonne les États-Unis… et disparaît.","couleurs":{"fond":"#0b0b0c","encre":"#ecebe6","accent":"#e0322b"},"police":"Oswald,'Arial Narrow',sans-serif","scenarios":[{"id":"s01e02","nom":"Samsara, les animaux fantômes","type":"Saison 1 · épisode 2 · ~2 h","resume":"Au Kansas, un couple jure que les fantômes de leurs animaux de compagnie hantent leur maison. Rendez-vous demain, 8 h.","joueurs":"channel-fear/?ep=s01e02","mj":"channel-fear/mj/?ep=s01e02","etatMj":{"cles":["cf-regie-v1-s01e02"]},"etatJoueurs":{"cles":["cf-carnet-v1"]}}]}];
const MODE="mj";          // "joueur" (racine du site) ou "mj" (site/mj/)
const RACINE=MODE==="mj"?"../":"./";      // liens du catalogue relatifs à la racine du site
const KEY="table-accueil-"+MODE;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st={jeu:null,sc:null};
let dernier=null; try{dernier=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
const jeu=id=>JEUX.find(j=>j.id===id), scen=(j,id)=>j&&j.scenarios.find(s=>s.id===id);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function lienDe(j,s,role){return RACINE+(role==="mj"?s.mj:s.joueurs);}
const etat=s=>s&&(MODE==="mj"?s.etatMj:s.etatJoueurs);
function partieEnCours(s){ const c=etat(s); if(!c) return false;
  return c.cles.some(k=>{ try{ const v=localStorage.getItem(k); if(!v||v==="null") return false; const o=JSON.parse(v); return !o||typeof o!=="object"||Object.keys(o).some(x=>!(c.garder||[]).includes(x)); }catch(e){ return true; } }); }
function supprimerPartie(s){ const c=etat(s), g=c.garder||[];
  for(const k of c.cles){ let o={}; try{o=JSON.parse(localStorage.getItem(k)||"{}")||{};}catch(e){}
    const reste={}; for(const x of g) if(o[x]!==undefined&&o[x]!=="") reste[x]=o[x];
    if(Object.keys(reste).length) localStorage.setItem(k,JSON.stringify(reste)); else localStorage.removeItem(k); } }
function theme(j){return `--c-bg:${j.couleurs.fond};--c-ink:${j.couleurs.encre};--c-acc:${j.couleurs.accent}`;}

function render(){
  $("#titre").innerHTML=MODE==="mj"?'Ma table · MJ <span class="mjtag">MJ</span>':"Ma table de jeu";
  $("#sous").textContent=MODE==="mj"?"Choisis le jeu, puis le scénario à mener.":"Choisis ton jeu, puis le scénario de la soirée.";
  const j=jeu(st.jeu), s=scen(j,st.sc);
  let h=`<nav class="etapes"><button class="${!j?"on":""}" data-go="0">1 · Jeu</button><button class="${j&&!s?"on":""}" data-go="1" ${j?"":"disabled"}>2 · Scénario</button><button class="${s?"on":""}" ${s?"":"disabled"}>3 · ${MODE==="mj"?"Mener":"Jouer"}</button></nav>`;
  if(!j){
    const dj=dernier&&jeu(dernier.jeu), ds=scen(dj,dernier&&dernier.sc);
    if(ds) h+=`<a class="reprendre" href="${lienDe(dj,ds,MODE)}"><span class="i">▶</span><span><b>Reprendre : ${esc(dj.nom)} — ${esc(ds.nom)}</b><small>${MODE==="mj"?"Espace MJ":"Mon carnet"} · dernière partie ouverte</small></span></a>`;
    if(ds&&partieEnCours(ds)) h+=`<button class="effacer" data-suppr="${dj.id}|${ds.id}">🗑 Supprimer ${MODE==="mj"?"la":"ma"} partie en cours et repartir de zéro</button>`;
    h+=`<h2>Jeux de rôle</h2>`+JEUX.map(x=>`<button class="jeu" style="${theme(x)}" data-jeu="${x.id}"><span class="nb">${x.scenarios.length} scénario${x.scenarios.length>1?"s":""}</span><div class="genre">${esc(x.genre)}</div><div class="nom" style="font-family:${x.police}">${esc(x.nom)}</div><p class="acc">${esc(x.accroche)}</p></button>`).join("");
  } else if(!s){
    h+=`<button class="jeu" style="${theme(j)};padding:14px 18px" data-go="0"><div class="genre">← Changer de jeu</div><div class="nom" style="font-family:${j.police};font-size:1.6rem">${esc(j.nom)}</div></button>`;
    h+=`<h2>Scénarios</h2>`+j.scenarios.map(x=>`<button class="sc" data-sc="${x.id}"><small>${esc(x.type)}</small><b>${esc(x.nom)}</b><span>${esc(x.resume)}</span></button>`).join("");
  } else {
    h+=`<div class="choix" style="${theme(j)};background:var(--c-bg);color:var(--c-ink)">
      <div class="genre" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.16em;color:var(--c-acc);font-weight:600">${esc(j.nom)} · ${esc(s.type)}</div>
      <p class="t" style="font-family:${j.police}">${esc(s.nom)}</p><p class="s">${esc(s.resume)}</p>`;
    if(MODE==="mj"){
      h+=`<a class="go p" style="background:var(--c-acc)" href="${lienDe(j,s,"mj")}" data-memo>🔒 Ouvrir l'espace MJ</a>
          <a class="go g" style="color:var(--c-ink)" href="${lienDe(j,s,"joueur")}" target="_blank">👁 Voir l'appli des joueurs</a>
          <button class="go g" style="color:var(--c-ink)" data-copie="${lienDe(j,s,"joueur")}">🔗 Copier le lien joueurs (Discord)</button>`;
      if(partieEnCours(s)) h+=`<button class="go g" style="color:#ff8a80;border-color:#ff8a8066" data-suppr="${j.id}|${s.id}">🗑 Supprimer la partie en cours</button>`;
    } else {
      h+=`<a class="go p" style="background:var(--c-acc);color:var(--c-bg)" href="${lienDe(j,s,"joueur")}" data-memo>Ouvrir mon carnet</a>`;
      if(partieEnCours(s)) h+=`<button class="go g" style="color:#ff8a80;border-color:#ff8a8066" data-suppr="${j.id}|${s.id}">🗑 Supprimer ma partie en cours</button>`;
    }
    h+=`<button class="go g" style="color:var(--c-ink)" data-go="1">← Autre scénario</button></div>`;
  }
  $("#app").innerHTML=h;
  $("#bas").innerHTML=MODE==="mj"?`<a href="../">Accueil des joueurs</a>`:`<a href="mj/">Espace MJ</a>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-jeu],[data-sc],[data-go],[data-copie],[data-memo],[data-suppr]"); if(!b) return;
  if(b.dataset.suppr){ const [ij,is]=b.dataset.suppr.split("|"), j=jeu(ij), s=scen(j,is); if(!s) return;
    const quoi=MODE==="mj"?"Progression, notes, équipe et chronos de l'espace MJ":"Personnage, notes, cartes et indices de ton carnet";
    const garde=(etat(s).garder||[]).includes("precedemment")?" (Le résumé « Précédemment » est conservé.)":"";
    if(!confirm("Supprimer la partie en cours de « "+s.nom+" » ?\n\n"+quoi+" seront effacés sur cet appareil. C'est définitif."+garde)) return;
    supprimerPartie(s); if(dernier&&dernier.jeu===ij&&dernier.sc===is){ dernier=null; try{localStorage.removeItem(KEY);}catch(_){} }
    toast("Partie supprimée · prête à repartir de zéro"); render(); return; }
  if(b.dataset.jeu){ st={jeu:b.dataset.jeu,sc:null}; const j=jeu(st.jeu); if(j.scenarios.length===1) st.sc=j.scenarios[0].id; }
  else if(b.dataset.sc) st.sc=b.dataset.sc;
  else if(b.dataset.go==="0") st={jeu:null,sc:null};
  else if(b.dataset.go==="1"){ st.sc=null; }
  else if(b.dataset.copie){ const url=new URL(b.dataset.copie,location.href).href; (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Lien copié")).catch(()=>prompt("Lien joueurs :",url)); return; }
  else if(b.hasAttribute("data-memo")){ try{localStorage.setItem(KEY,JSON.stringify(st));}catch(_){} return; }
  render(); scrollTo(0,0);
});
render();
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register(RACINE+"sw.js").catch(()=>{});
</script>
</body>
</html>
