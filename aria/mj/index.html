<style>
:root{--bg:#13100c;--card:#1d1813;--ink:#eee3cc;--mute:#a7967b;--line:#382e23;--gold:#dcaa4a;--red:#e57a68}

label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.9rem}
