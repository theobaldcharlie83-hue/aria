<style>
:root{
  --bg:#f3ead8;--card:#fffaf0;--card2:#f8f0de;--ink:#2a2118;--mute:#76664f;--line:#e0d1b3;
  --gold:#8f6210;--red:#a03222;--green:#386b32;--blue:#2c5878;--violet:#5d3f86;--read:#f6ecd3;--chip:#ece0c4;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13100c;--card:#1d1813;--card2:#241e17;--ink:#eee3cc;--mute:#a7967b;--line:#382e23;
  --gold:#dcaa4a;--red:#e57a68;--green:#94c486;--blue:#86b6da;--violet:#b79ae0;--read:#262016;--chip:#2c241a;}}
:root[data-theme="dark"]{--bg:#13100c;--card:#1d1813;--card2:#241e17;--ink:#eee3cc;--mute:#a7967b;--line:#382e23;
  --gold:#dcaa4a;--red:#e57a68;--green:#94c486;--blue:#86b6da;--violet:#b79ae0;--read:#262016;--chip:#2c241a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.15}
h1{font-size:1.9rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.top .wrap{display:flex;align-items:center;gap:10px}
.emb{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--gold);display:grid;place-items:center;font-size:1.3rem;flex:none}
.herosw{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.herosw .emb{position:relative}
.herosw .emb::after{content:"⇄";position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:.68rem;line-height:17px;text-align:center;font-weight:700}
.herosw:active .emb{transform:scale(.94)}
.who{flex:1;min-width:0;display:block}.who b{font-family:var(--serif);font-size:1.25rem;display:block;line-height:1.1}.who small{color:var(--mute);font-size:.75rem}
.hpbox{text-align:center;min-width:64px}.hpbox b{font-family:var(--serif);font-size:1.5rem}.hpbox small{display:block;font-size:.65rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:-3px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;color:var(--mute)}
nav.tabs button span{font-size:1.25rem;line-height:1}
nav.tabs button.on{color:var(--gold);font-weight:600}
.sec{padding:14px 0 6px}.sec>h2{margin:4px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;padding:12px 14px}
.blk{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.93rem;background:var(--card2)}
.blk b.lab{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;color:var(--gold)}
.read{background:var(--read);font-family:var(--serif);font-size:1.1rem;line-height:1.45;border-left:3px solid var(--gold)}
.read b.lab{font-family:var(--sans)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 12px;font-weight:500;min-height:42px}
.btn.p{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn.s{padding:5px 10px;min-height:34px;font-size:.85rem}.btn.d{color:var(--red)}
.muted{color:var(--mute)}.small{font-size:.8rem}
input[type=number],input[type=text],select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;width:100%}
textarea{min-height:80px;resize:vertical}
.num{width:70px!important;text-align:center}
.stat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 8px}
.stat div{background:var(--card2);border-radius:10px;padding:6px 2px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem}.stat small{color:var(--mute);font-size:.65rem}
.counter{display:flex;align-items:center;gap:6px}
.counter b{min-width:40px;text-align:center;font-family:var(--serif);font-size:1.45rem}
.counter button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:1.15rem}
.hr{height:1px;background:var(--line);margin:12px 0}
.skill{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.skill:last-child{border-bottom:0}
.skill .n{flex:1}.skill .v{font-family:var(--serif);font-size:1.25rem;font-weight:700;min-width:46px;text-align:right}
.skill .l{font-size:.7rem;color:var(--mute)}
.skill.hi .v{color:var(--gold)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:left;min-height:150px;display:flex;flex-direction:column;gap:6px}
.pick button .e{font-size:2rem}
.pick button b{font-family:var(--serif);font-size:1.2rem}
.pick button small{color:var(--mute);font-size:.78rem;line-height:1.35}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line)}
.item:last-child{border-bottom:0}
.item .q{min-width:34px;text-align:center;font-weight:600;background:var(--chip);border-radius:8px;padding:2px 6px;font-size:.85rem}
.coin{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.dice{font-family:var(--serif);font-size:3rem;font-weight:700;text-align:center;line-height:1.1}
.msg{text-align:center;font-weight:600;min-height:1.4em}
.ok{color:var(--green)}.ko{color:var(--red)}.crit{color:var(--gold)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.sheet.show{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.suit{font-size:1.5rem;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:6px 0}
.suit.on{border-color:var(--gold);background:var(--read)}
.redc{color:#c0392b}
.cardface{width:120px;height:170px;margin:6px auto;border-radius:12px;background:#fdfaf2;color:#222;border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.cardface b{font-size:2.6rem;line-height:1}.cardface span{font-size:3rem;line-height:1}
.cardface.r{color:#b3261e}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;white-space:nowrap;font-size:.85rem;flex:none}
.chip.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.asearch{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
.atri{display:flex;align-items:center;gap:8px;margin:0 2px 6px;font-size:.85rem;color:var(--mute)}.atri select{flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.agrp{margin:16px 2px 2px;font-family:var(--serif);font-size:1.15rem;font-weight:700}
.arow{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line)}
.arow .n{flex:1;min-width:0}.arow .n small{display:block;color:var(--mute);font-size:.78rem;line-height:1.35}
.arow .pr{text-align:right;white-space:nowrap;font-weight:600;color:var(--gold)}.arow .pr small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.arow.cher .pr{color:var(--mute);font-weight:400}
.arow{align-items:center}.arow .abuy{flex:none;min-width:42px}
.buyf{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin:12px 0}.buyf input,.buyf select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.buyp{display:flex;gap:8px}.buyp input{flex:1;min-width:0}.buyp select{flex:1.3}
.bres{border-radius:10px;padding:10px 12px;background:var(--card2);font-size:.92rem;margin-bottom:10px}
.conv{font-size:.8rem;color:var(--mute);margin:-2px 2px 10px}
.pill{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:.8rem;display:inline-block;margin:2px}
.pill.jcard{border:1px solid var(--line);padding:6px 12px;font-size:.95rem;font-weight:600}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px}
details.acc>summary{list-style:none;padding:13px 14px;font-family:var(--serif);font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"›";margin-left:auto;color:var(--mute);font-family:var(--sans);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(90deg)}
details.acc>.in{padding:0 14px 14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.tagline{font-family:var(--serif);font-style:italic;font-size:1.05rem}
.sess{border-left:3px solid var(--gold);padding-left:12px;margin:12px 0}
.hidden{display:none!important}
.sess h3{margin-bottom:2px}.sess .d{font-size:.75rem;color:var(--mute)}
/* Cartes des lieux */
.mapwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#efe2c2;line-height:0;margin:0 0 12px}
.mapwrap svg{width:100%;height:auto;display:block}
.codein{font-family:var(--serif);font-size:2rem;font-weight:700;letter-spacing:.45em;text-align:center;padding-left:.45em!important;min-height:56px!important}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.lieu-it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 8px}
.lieu-it .ic{width:44px;height:44px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:1.4rem;flex:none}
.lieu-it b{font-family:var(--serif);font-size:1.15rem;display:block;line-height:1.15}.lieu-it small{color:var(--mute);font-size:.78rem}
.lieu-it.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.here{color:var(--red);font-weight:600;font-size:.75rem;white-space:nowrap}
.ov{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.ov .bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.ov .bar .wrap{display:flex;align-items:center;gap:10px}
.ill{width:100%;display:block;border-radius:12px;background:var(--card2);min-height:140px;object-fit:cover;margin:0 0 4px}
.leg{font-size:.78rem;color:var(--mute);font-style:italic;margin:0 2px 12px}
.plan{width:100%;display:block;border-radius:10px;border:1px solid var(--line);background:#efe2c2;cursor:zoom-in}
.reveal{animation:rv 1.1s ease}@keyframes rv{from{opacity:0;filter:blur(10px) sepia(1);transform:scale(1.03)}to{opacity:1;filter:none;transform:none}}
.zoomov{position:fixed;inset:0;z-index:90;background:#0d0b08}
.zoomov .sc{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.zoomov img{display:block;max-width:none}
.zoomov .zb{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px}
.zoomov .zb button,.zoomov .zx{width:48px;height:48px;border-radius:50%;border:1px solid #6b5134;background:#1d1813;color:#eee3cc;font-size:1.3rem}
.zoomov .zx{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top))}
.zoomov .zback{position:absolute;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));height:48px;padding:0 18px;border-radius:24px;border:1px solid #6b5134;background:#1d1813;color:#eee3cc;font-size:1rem;font-weight:600}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.doc{border-radius:6px;padding:18px;margin:0 0 12px;font-family:var(--serif);font-size:calc(1.15rem * var(--fz,1));line-height:1.5;color:#3a2614;background:radial-gradient(ellipse at center,#f3e5c3 0%,#e6cf9d 65%,#c9a66b 100%);box-shadow:inset 0 0 30px rgba(90,55,15,.45)}
.doc h4{margin:0 0 10px;text-align:center;font-size:1.15em;font-family:var(--serif)}
.doc p{margin:0 0 .5em}.doc.grand{font-size:calc(1.6rem * var(--fz,1));text-align:center;padding:26px 18px}
.doc.metal{background:linear-gradient(135deg,#7d848b,#c9ced3 45%,#868c92 70%,#6c7279);color:#1b2025;font-style:italic;text-align:center;box-shadow:inset 0 0 18px rgba(0,0,0,.55);border-radius:3px}
.doc.bois{background:repeating-linear-gradient(90deg,#b98b5a 0 14px,#ae7f4c 14px 23px);color:#24140a;text-align:center;box-shadow:inset 0 0 22px rgba(60,30,5,.6)}
.doc.journal{border-left:14px solid #1f3a66;font-style:italic}
.trans{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:-4px 0 14px;font-size:calc(.95rem * var(--fz,1))}
.trans summary{font-weight:600;font-size:.85rem;color:var(--gold);cursor:pointer}
.trans p{margin:.45em 0 0}
.docimg{display:block;max-width:100%;max-height:62vh;width:auto;margin:0 auto;border-radius:6px;cursor:zoom-in;background:#efe2c2}
</style>
</head>

function render(){
  const m=$("#main");

  $("#top").classList.remove("hidden"); $("#tabs").classList.remove("hidden");
  const h=H(),p=P();

  $("#hpTop").innerHTML=`${p.pv}<span class="muted" style="font-size:.9rem">/${h.pv}</span>`;
  const pw={mort:["💀","Magie"],cartes:["🃏","Magie"],combat:["⚔️","Combat"],ruses:["🗝️","Ruses"]}[h.pouvoir];
  $("#powIcon").textContent=pw[0]; $("#powLab").textContent=pw[1];

  const J=JOURNAL;

  (J.seances||[]).slice().reverse().forEach(s=>{
    h+=`<div class="sess"><h3>${esc(s.titre)}</h3><div class="d">${esc(s.date)}</div><p style="margin:6px 0">${esc(s.resume)}</p>
      ${s.pnj&&s.pnj.length?`<p class="small"><b>Rencontres :</b> ${s.pnj.map(esc).join(" · ")}</p>`:""}
      ${s.lieux&&s.lieux.length?`<p class="small"><b>Lieux :</b> ${s.lieux.map(esc).join(" · ")}</p>`:""}
      ${s.butin&&s.butin.length?`<p class="small"><b>Butin & objets :</b> ${s.butin.map(esc).join(" · ")}</p>`:""}

const LKEY="aria-lieux-v1";
let L; try{L=JSON.parse(localStorage.getItem(LKEY)||"null");}catch(e){L=null;}
if(!L||!L.found) L={found:{},cur:null,v:null};
function lsave(){try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(e){}}
function lieuxReset(){ // oublie toutes les cartes découvertes : il faudra de nouveau les codes du MJ
  L={found:{},cur:null,v:L.v}; lsave();
  Object.keys(LURL).forEach(k=>{try{URL.revokeObjectURL(LURL[k]);}catch(e){} delete LURL[k];}); Object.keys(LKEYS).forEach(k=>delete LKEYS[k]);
}
let LDATA=null; const LKEYS={}, LURL={};
const b64u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function lieuxData(){
  if(LDATA) return LDATA;
  const r=await fetch("lieux.json",{cache:"no-cache"}); LDATA=await r.json();
  if(L.v&&L.v!==LDATA.v){ // le MJ a mis les cartes à jour : on redéchiffre ce qui était déjà découvert
    for(const id of Object.keys(L.found)){ const p=await lieuDecrypt(L.found[id].code); if(p) L.found[p.id]={code:L.found[id].code,p}; else delete L.found[id]; }
  }
  L.v=LDATA.v; lsave(); return LDATA;
}
async function lieuTag(code){ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("aria-lieu|"+code)); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,16); }
async function lieuKey(code,salt){ const k=code+"|"+salt; if(LKEYS[k]) return LKEYS[k];
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  return LKEYS[k]=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64u(salt),iterations:LDATA.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]); }
async function lieuDecrypt(code){
  const t=await lieuTag(code), e=LDATA.entries.find(x=>x.t===t); if(!e) return null;
  const k=await lieuKey(code,e.s);
  const p=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(e.i)},k,b64u(e.c))));
  p.salt=e.s; return p;
}
async function lieuImg(id,f){
  if(LURL[f]) return LURL[f];
  const F=L.found[id]; const k=await lieuKey(F.code,F.p.salt);
  const buf=new Uint8Array(await (await fetch(f)).arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},k,buf.slice(12));
  return LURL[f]=URL.createObjectURL(new Blob([pt],{type:"image/jpeg"}));
}
function lieuPlan(id){ const k="plan:"+id+":"+L.v; return LURL[k]||(LURL[k]=URL.createObjectURL(new Blob([L.found[id].p.plan],{type:"image/svg+xml"}))); }

async function drawCarte(){
  const el=$("#regionMap"); if(!el) return;
  try{ await lieuxData(); }catch(e){ el.style.aspectRatio="auto"; el.innerHTML='<p class="muted small" style="padding:14px;line-height:1.4">Carte indisponible : ouvrez le carnet une fois avec du réseau.</p>'; return; }
  const ls=lieuxTries(), cur=L.found[L.cur]?L.found[L.cur].p:null;
  let over=ls.map(p=>p.region.layer||"").join("");
  const pts={}; ls.forEach(p=>{const k=p.region.x+","+p.region.y; (pts[k]=pts[k]||[]).push(p.id);});
  over+=Object.entries(pts).map(([k,ids])=>{const [x,y]=k.split(","); return `<g data-act="lieux-pt" data-ids="${ids.join(",")}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="30" fill="#000" fill-opacity="0"/></g>`;}).join("");
  if(cur){ const {x,y}=cur.region; over+=`<g pointer-events="none"><circle cx="${x}" cy="${y}" r="12" fill="none" stroke="#9b2d1f" stroke-width="3"><animate attributeName="r" values="10;24;10" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="${y}" r="6" fill="#9b2d1f"/><text x="${x}" y="${+y-22}" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#9b2d1f" stroke="#efe2c2" stroke-width="4" paint-order="stroke">Vous êtes ici</text></g>`; }
  el.innerHTML=LDATA.base.replace(/<\/svg>\s*$/,over+"</svg>");
  el.onclick=e=>{ if(e.target.closest("[data-act]")) return; const svg=el.innerHTML.replace(/<animate[^>]*>/g,""); $("#zoomImg").src=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"})); $("#zoomOv").classList.remove("hidden"); ZOOM=1; setTimeout(()=>zoomSet(2),30); };
}
async function lieuUnlock(){
  const inp=$("#lcode"); if(!inp) return; const code=inp.value.replace(/\D/g,"");
  if(code.length!==3){ toast("Le code a 3 chiffres"); return; }
  let D; try{ D=await lieuxData(); }catch(e){ toast("Pas de réseau : impossible de vérifier le code"); return; }
  let p=null; try{ p=await lieuDecrypt(code); }catch(e){ p=null; }
  if(!p){ inp.value=""; inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); toast("Ce code ne mène nulle part…"); return; }
  const neuf=!L.found[p.id]; L.found[p.id]={code,p}; L.v=D.v;
  if(p.kind==="piece"){ L.seg="pieces"; lsave(); p.blocs.forEach(b=>{ if(b.f) fetch(b.f).catch(()=>{}); }); render(); pieceOpen(p.id,neuf); return; }
  L.cur=p.id; L.seg="carte"; lsave();
  p.imgs.forEach(im=>fetch(im.f).catch(()=>{})); // met les illustrations en cache pour le hors-ligne
  render(); lieuOpen(p.id,neuf);
}
async function lieuOpen(id,neuf){
  const F=L.found[id]; if(!F) return; const p=F.p, ov=$("#lieuOv");
  ov.innerHTML=`<div class="bar"><div class="wrap"><span style="font-size:1.4rem">${lieuIcon(id)}</span><div class="grow" style="min-width:0"><h2 style="font-size:1.3rem">${esc(p.titre)}</h2><small class="muted">${esc(p.sous||"")}</small></div><button class="ibtn" data-act="lclose" aria-label="Fermer">✕</button></div></div>
  <div class="wrap ${neuf?"reveal":""}" style="padding-top:12px">
    ${p.imgs.map((im,i)=>`<img class="ill" id="lim${i}" alt="${esc(im.leg)}"><p class="leg">${esc(im.leg)}</p>`).join("")}
    ${p.texte.map(t=>`<div class="blk read">${esc(t)}</div>`).join("")}
    <h3 style="margin:16px 2px 8px">Plan du lieu</h3>
    <img class="plan" src="${lieuPlan(id)}" alt="Plan : ${esc(p.titre)}" data-act="lzoom" data-id="${id}">
    <p class="small muted" style="margin:6px 2px 14px">Touchez le plan pour l'agrandir.</p>
    <div class="row">${L.cur===id?'<span class="here grow" style="font-size:.9rem;text-align:center">📍 Vous êtes ici</span>':`<button class="btn grow" data-act="lhere" data-id="${id}">📍 Nous sommes ici</button>`}<button class="btn p grow" data-act="lclose">Retour à la carte</button></div>
  </div>`;
  ov.classList.remove("hidden"); ov.scrollTop=0; document.body.style.overflow="hidden";
  p.imgs.forEach((im,i)=>lieuImg(id,im.f).then(u=>{const e=$("#lim"+i); if(e) e.src=u;}).catch(()=>{const e=$("#lim"+i); if(e){e.replaceWith(Object.assign(document.createElement("p"),{className:"small muted",textContent:"Illustration indisponible hors ligne."}));}}));
}
function lieuClose(){ $("#lieuOv").classList.add("hidden"); $("#lieuOv").innerHTML=""; document.body.style.overflow=""; }
let ZOOM=1;
function zoomSet(z,keep){ const sc=$("#zoomSc"), img=$("#zoomImg"); const cx=(sc.scrollLeft+sc.clientWidth/2)/(img.offsetWidth||1), cy=(sc.scrollTop+sc.clientHeight/2)/(img.offsetHeight||1);
  ZOOM=Math.max(1,Math.min(4,z)); img.style.width=(sc.clientWidth*ZOOM)+"px";
  if(keep){ sc.scrollLeft=cx*img.offsetWidth-sc.clientWidth/2; sc.scrollTop=cy*img.offsetHeight-sc.clientHeight/2; } }
document.addEventListener("input",e=>{ if(e.target.id==="lcode"){ e.target.value=e.target.value.replace(/\D/g,"").slice(0,3); if(e.target.value.length===3) lieuUnlock(); } });
document.addEventListener("keydown",e=>{ if(e.target.id==="lcode"&&e.key==="Enter") lieuUnlock(); });
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  switch(a){
    case "lunlock": lieuUnlock(); break;
    case "lieu": closeSheet(); lieuOpen(b.dataset.id); break;
    case "piece": pieceOpen(b.dataset.id); break;
    case "lseg": L.seg=b.dataset.s; lsave(); render(); break;
    case "fz": { FZ=Math.max(.8,Math.min(1.8,Math.round((FZ+(+b.dataset.d)*.15)*100)/100)); try{localStorage.setItem("aria-fz",FZ);}catch(e){} const pb=$("#pieceBody"); if(pb) pb.style.setProperty("--fz",FZ); break; }
    case "pzoom": { if(!b.src) break; const ov=$("#zoomOv"); $("#zoomImg").src=b.src; ov.classList.remove("hidden"); ZOOM=1; setTimeout(()=>zoomSet(2),30); break; }
    case "lieux-pt": { const ids=b.dataset.ids.split(","); if(ids.length===1){ lieuOpen(ids[0]); break; }
      openSheet(`<h3 style="margin:0 0 10px">Lieux découverts ici</h3>${ids.map(id=>L.found[id].p).sort((x,y)=>x.ordre-y.ordre).map(p=>`<button class="lieu-it" data-act="lieu" data-id="${p.id}"><span class="ic">${lieuIcon(p.id)}</span><span class="grow"><b>${esc(p.titre)}</b><small>${esc(p.sous||"")}</small></span></button>`).join("")}<button class="btn" style="width:100%" data-act="close">Fermer</button>`); break; }
    case "lclose": lieuClose(); break;
    case "lhere": L.cur=b.dataset.id; lsave(); lieuOpen(b.dataset.id); render(); toast("Position mise à jour"); break;
    case "lzoom": { const ov=$("#zoomOv"); $("#zoomImg").src=b.src; ov.classList.remove("hidden"); ZOOM=1; setTimeout(()=>zoomSet(1.6),30); break; }
    case "zin": zoomSet(ZOOM*1.5,true); break;
    case "zout": zoomSet(ZOOM/1.5,true); break;
    case "zclose": $("#zoomOv").classList.add("hidden"); break;
    case "monde": mondeOpen(); break;
  }
});

/* ============ Achat : prix de l'équipement (ARIA 1, p. 327-331) ============ */
let ACH=null, achQ="";
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmtPrix=r=>{ if(r>=1000&&r%1000===0){const n=r/1000;return n+" couronne"+(n>1?"s":"");} if(r>=100&&r%100===0){const n=r/100;return n+" orbe"+(n>1?"s":"");} if(r>=10&&r%10===0){const n=r/10;return n+" sceptre"+(n>1?"s":"");} return r+" roi"+(r>1?"s":""); };
function achLoad(){ if(ACH) return Promise.resolve(ACH); return fetch("achats.json").then(r=>r.json()).then(j=>ACH=j); }
function vAchat(){
  const f=S.ach||(S.ach={cat:"all",tri:"cat"});
  const cats=ACH?ACH.cats:[];
  const n=id=>ACH?ACH.items.filter(x=>id==="all"||x.cat===id).length:0;
  return `<div class="sec"><h2>Achat</h2>
  <p class="conv">1 couronne = 10 orbes = 100 sceptres = 1 000 rois · ${S.hero?`votre bourse : <b>${(()=>{const t=total(P().bourse),f=fmtPrix(t);return t?f+(/rois?$/.test(f)?"":` (${t} rois)`):"vide";})()}</b>`:""}</p>
  <input id="achQ" class="asearch" type="search" placeholder="Chercher un objet, une arme…" value="${esc(achQ)}" autocomplete="off">
  <div class="chips"><button class="chip ${f.cat==="all"?"on":""}" data-act="achcat" data-c="all">Tout · ${n("all")}</button>${cats.map(c=>`<button class="chip ${f.cat===c.id?"on":""}" data-act="achcat" data-c="${c.id}">${c.ic} ${esc(c.nom)} · ${n(c.id)}</button>`).join("")}</div>
  <label class="atri">Trier <select id="achTri"><option value="cat"${f.tri==="cat"?" selected":""}>par catégorie</option><option value="asc"${f.tri==="asc"?" selected":""}>du moins cher au plus cher</option><option value="desc"${f.tri==="desc"?" selected":""}>du plus cher au moins cher</option><option value="nom"${f.tri==="nom"?" selected":""}>par nom (A → Z)</option></select></label>
  <div id="achList"><p class="small muted">Chargement des prix…</p></div>
  <p class="small muted" style="margin-top:14px">Prix indicatifs du livre : le MJ peut marchander, majorer en temps de crise ou faire un geste.</p></div>`;
}
function achDraw(){
  const el=$("#achList"); if(!el) return;
  if(!ACH){ achLoad().then(()=>{ if(S.tab==="achat") render(); }).catch(()=>{ const e=$("#achList"); if(e) e.innerHTML='<p class="small muted">Prix indisponibles hors ligne : ouvrez le carnet une fois avec du réseau.</p>'; }); return; }
  const f=S.ach, q=norm(achQ.trim()), budget=S.hero?total(P().bourse):Infinity;
  const ordre=Object.fromEntries(ACH.cats.map((c,i)=>[c.id,i]));
  let it=ACH.items.filter(x=>(f.cat==="all"||x.cat===f.cat)&&(!q||norm(x.nom+" "+(x.info||"")+" "+(x.dg||"")).includes(q)));
  const byNom=(a,b)=>a.nom.localeCompare(b.nom,"fr");
  it.sort(f.tri==="asc"?(a,b)=>a.rois-b.rois||byNom(a,b):f.tri==="desc"?(a,b)=>b.rois-a.rois||byNom(a,b):f.tri==="nom"?byNom:(a,b)=>ordre[a.cat]-ordre[b.cat]||a.rois-b.rois||byNom(a,b));
  if(!it.length){ el.innerHTML='<p class="small muted">Aucun objet trouvé.</p>'; return; }
  let h="", last=null;
  for(const x of it){
    if(f.tri==="cat"&&x.cat!==last){ const c=ACH.cats[ordre[x.cat]]; h+=`<div class="agrp">${c.ic} ${esc(c.nom)}</div>`; last=x.cat; }
    const det=[x.dg?`🎲 ${x.dg}`:"",x.prot?`🛡️ protection ${x.prot}`:"",x.info||"",x.unite||"",f.tri!=="cat"&&f.cat==="all"?ACH.cats[ordre[x.cat]].nom.toLowerCase():""].filter(Boolean).join(" · ");
    const sub=fmtPrix(x.rois).endsWith("roi")||fmtPrix(x.rois).endsWith("rois")?"":`${x.rois.toLocaleString("fr-FR")} rois`;
    h+=`<div class="arow ${x.rois>budget?"cher":""}"><span class="n"><b>${esc(x.nom)}</b>${det?`<small>${esc(det)}</small>`:""}</span><span class="pr">${fmtPrix(x.rois)}${x.unite?" / km":""}${sub?`<small>${sub}</small>`:""}${x.rois>budget?"<small>au-dessus de votre bourse</small>":""}</span>${S.hero?`<button class="btn s abuy" data-act="achbuy" data-i="${ACH.items.indexOf(x)}" aria-label="Acheter ${esc(x.nom)}">🛒</button>`:""}</div>`;
  }
  el.innerHTML=h;
  const on=document.querySelector(".chip.on"), bar=on&&on.parentElement; if(bar) bar.scrollLeft=on.offsetLeft-bar.offsetLeft-(bar.clientWidth-on.offsetWidth)/2;
}
document.addEventListener("input",e=>{ if(e.target.id==="achQ"){ achQ=e.target.value; achDraw(); } });
document.addEventListener("change",e=>{ if(e.target.id==="achTri"){ S.ach.tri=e.target.value; save(); achDraw(); } });
document.addEventListener("click",e=>{ const b=e.target.closest('[data-act="achcat"]'); if(!b) return; S.ach.cat=b.dataset.c; save(); render(); });
/* Acheter : l'objet passe dans le sac, le prix (négocié si besoin) est retiré de la bourse */
const UNITES=[["couronnes",1000],["orbes",100],["sceptres",10],["rois",1]];
const unitDe=r=>UNITES.find(([,v])=>r>=v&&r%v===0)||UNITES[3];
const prixTxt=r=>{ const f=fmtPrix(r); return /rois?$/.test(f)?f:`${f} (${r} rois)`; };
function achBuy(i){
  const x=ACH.items[i]; if(!x||!S.hero) return; const [u,v]=unitDe(x.rois);
  openSheet(`<h3 style="margin:0 0 4px">🛒 ${esc(x.nom)}</h3>
  <p class="small muted" style="margin:0">Prix du livre : ${fmtPrix(x.rois)}${x.unite?" / km":""}. Vous avez négocié ? Changez le prix ci-dessous.</p>
  <div class="buyf"><label for="bq">Quantité</label><input id="bq" type="number" inputmode="numeric" min="1" value="1">
    <label for="bp">Prix pièce</label><div class="buyp"><input id="bp" type="number" inputmode="decimal" min="0" value="${x.rois/v}"><select id="bu">${UNITES.map(([n,val])=>`<option value="${val}"${n===u?" selected":""}>${n}</option>`).join("")}</select></div></div>
  <div class="bres" id="bres"></div>
  <div class="row"><button class="btn p grow" id="bok" data-act="achok" data-i="${i}">Acheter</button><button class="btn grow" data-act="close">Annuler</button></div>`);
  achCalc();
}
function achCout(){ const q=Math.max(1,Math.floor(+$("#bq").value||1)), pr=Math.max(0,+$("#bp").value||0), un=+$("#bu").value; return {q,cout:Math.round(q*pr*un)}; }
function achCalc(){ const el=$("#bres"); if(!el) return; const {cout}=achCout(), t=total(P().bourse), reste=t-cout, ok=reste>=0;
  el.innerHTML=`Coût : <b>${cout?prixTxt(cout):"gratuit"}</b><br>${ok?`Il vous restera : <b>${reste?prixTxt(reste):"plus rien"}</b>`:`<span class="ko">Bourse insuffisante : il manque ${prixTxt(-reste)}.</span>`}`;
  const b=$("#bok"); if(b) b.disabled=!ok; }
document.addEventListener("input",e=>{ if(e.target.id==="bq"||e.target.id==="bp") achCalc(); });
document.addEventListener("change",e=>{ if(e.target.id==="bu") achCalc(); });
document.addEventListener("click",e=>{ const b=e.target.closest('[data-act="achbuy"],[data-act="achok"]'); if(!b) return;
  if(b.dataset.act==="achbuy"){ achBuy(+b.dataset.i); return; }
  const x=ACH.items[+b.dataset.i], p=P(), {q,cout}=achCout(), t=total(p.bourse);
  if(cout>t){ toast("Bourse insuffisante"); return; }
  const r=t-cout; p.bourse={c:Math.floor(r/1000),o:Math.floor(r%1000/100),s:Math.floor(r%100/10),r:r%10};
  const it=p.sac.find(o=>norm(o.n)===norm(x.nom)); if(it) it.q+=q; else p.sac.push({n:x.nom,q});
  save(); closeSheet(); render(); toast(`${q>1?q+" × ":""}${x.nom} dans le sac · reste ${r?fmtPrix(r):"plus rien"}`);
});

/* ============ Carte du monde (toujours accessible par 🌍) ============ */
function mondeOpen(){
  const img=$("#zoomImg"), sc=$("#zoomSc");
  img.onload=()=>{ img.onload=null; zoomSet(Math.max(1,sc.clientHeight/(sc.clientWidth*img.naturalHeight/img.naturalWidth))); sc.scrollLeft=img.offsetWidth*.47-sc.clientWidth/2; sc.scrollTop=0; };
  img.alt="Carte du monde d'Aria"; $("#zoomOv").classList.remove("hidden"); ZOOM=1; img.style.width=sc.clientWidth+"px";
  if(img.src.endsWith("monde.jpg")&&img.complete) img.onload(); else img.src="monde.jpg";
}
$("#btnMonde").onclick=mondeOpen;

applyTheme(); render();
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

/* Bouton/geste « retour » du téléphone : ferme la visionneuse ou la fiche ouverte au lieu de quitter l'appli */
(function(){ const ids=["zoomOv","lieuOv"]; let skip=0;
  ids.forEach(id=>{ const el=document.getElementById(id); if(!el) return; let was=!el.classList.contains("hidden");
    new MutationObserver(()=>{ const vis=!el.classList.contains("hidden"); if(vis===was) return; was=vis;
      if(vis) history.pushState({ov:id},"");
      else if(history.state&&history.state.ov===id){ skip++; history.back(); } }).observe(el,{attributes:true,attributeFilter:["class"]}); });
  addEventListener("popstate",()=>{ if(skip){ skip--; return; }
    for(const id of ids){ const el=document.getElementById(id); if(el&&!el.classList.contains("hidden")){ const b=el.querySelector('[data-act="zclose"],[data-act="lclose"]'); if(b) b.click(); else el.classList.add("hidden"); return; } } });
})();
</script>
